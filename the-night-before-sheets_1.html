<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Night Before: Casefiles</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Homemade+Apple&family=Rock+Salt&display=swap" rel="stylesheet">
<style>
  :root{
    --leather:#3b2a1e;
    --leather-dark:#1f1410;
    --paper:#e6d7ad;
    --paper-dark:#cdb98a;
    --paper-edge:#b89c66;
    --line:rgba(70,90,140,.32);
    --ink:#2a2118;
    --ink-soft:#4a3b2c;
    --ring:#8a8a86;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:#15100c;color:var(--ink);font-family:'Caveat','Segoe Print','Bradley Hand',cursive}
  body{padding:32px 16px}

  .book{
    position:relative;
    width:min(1180px,100%);
    aspect-ratio:1180/740;
    margin:0 auto 48px;
    background:
      radial-gradient(ellipse at 30% 20%, #4a3628 0%, transparent 60%),
      radial-gradient(ellipse at 80% 90%, #2a1c14 0%, transparent 60%),
      var(--leather);
    border-radius:22px 26px 26px 22px;
    box-shadow:0 30px 60px rgba(0,0,0,.65), inset 0 0 0 3px var(--leather-dark), inset 0 0 40px rgba(0,0,0,.5);
    padding:26px 30px;
    page-break-after:always;
    break-after:page;
  }
  .book::after{
    content:attr(data-page);
    position:absolute;top:44px;right:64px;
    font-family:'Rock Salt',cursive;font-size:20px;color:var(--ink-soft);transform:rotate(3deg);
  }
  /* stacked page edges peeking out under the spread */
  .book::before{
    content:"";position:absolute;inset:26px 30px;
    background:
      linear-gradient(to right, transparent 49.2%, #6a4a2a 49.6%, #3a2716 50.4%, transparent 50.8%),
      repeating-linear-gradient(to bottom, var(--paper-edge) 0 1px, #d9c79a 1px 3px);
    transform:translate(4px,5px) rotate(.25deg);
    box-shadow:0 0 0 1px rgba(0,0,0,.35);
  }

  .spread{
    position:relative;height:100%;display:grid;grid-template-columns:1fr 1fr;
    background-color:var(--paper);
    background-image:
      /* ruled lines */
      repeating-linear-gradient(to bottom, transparent 0 27px, var(--line) 27px 28px),
      /* dark handling around the edges and the gutter */
      linear-gradient(to right, rgba(90,60,25,.38) 0, transparent 5%, transparent 46%, rgba(70,45,20,.42) 49.6%, rgba(40,25,10,.6) 50%, rgba(70,45,20,.42) 50.4%, transparent 54%, transparent 95%, rgba(90,60,25,.38) 100%),
      linear-gradient(to bottom, rgba(90,60,25,.32) 0, transparent 6%, transparent 93%, rgba(90,60,25,.42) 100%),
      /* stains: rings, blotches, a drip */
      radial-gradient(circle at 17% 78%, transparent 0 5.2%, rgba(110,70,25,.38) 5.4%, rgba(110,70,25,.14) 6.2%, transparent 7%),
      radial-gradient(circle at 19% 81%, rgba(110,70,25,.22) 0 2.6%, transparent 4%),
      radial-gradient(circle at 74% 63%, rgba(120,80,30,.30) 0 3.5%, rgba(120,80,30,.10) 5.5%, transparent 7.5%),
      radial-gradient(circle at 78% 67%, rgba(120,80,30,.32) 0 1.6%, transparent 3.5%),
      radial-gradient(circle at 63% 91%, rgba(80,50,20,.25) 0 1.2%, transparent 2.6%),
      radial-gradient(ellipse 1.2% 6% at 90% 22%, rgba(60,40,15,.28) 0 60%, transparent 100%),
      radial-gradient(circle at 90% 30%, rgba(60,40,15,.30) 0 1%, transparent 2%),
      radial-gradient(circle at 34% 12%, rgba(110,80,40,.16) 0 4%, transparent 8%),
      radial-gradient(circle at 56% 8%, rgba(60,40,15,.5) 0 .25%, transparent .9%),
      radial-gradient(circle at 42% 88%, rgba(60,40,15,.45) 0 .2%, transparent .8%),
      /* foxing and yellowing */
      radial-gradient(ellipse at 8% 30%, rgba(150,110,50,.22) 0 12%, transparent 30%),
      radial-gradient(ellipse at 96% 80%, rgba(150,110,50,.26) 0 10%, transparent 28%),
      radial-gradient(ellipse at 40% 50%, rgba(150,110,50,.10) 0 30%, transparent 60%),
      /* grain */
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35 0 0 0 0 .25 0 0 0 0 .1 0 0 0 .55 0'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>");
    box-shadow:inset 0 0 70px rgba(80,50,20,.45), 0 0 0 1px rgba(0,0,0,.3);
  }
  /* creases */
  .spread .crease{position:absolute;pointer-events:none;background:linear-gradient(to right, transparent, rgba(60,40,15,.28) 45%, rgba(255,240,200,.35) 55%, transparent);}
  .spread .crease.a{left:6%;top:0;bottom:0;width:6px;transform:rotate(1.4deg)}
  .spread .crease.b{right:14%;top:0;bottom:0;width:5px;transform:rotate(-2.2deg)}
  .spread .crease.c{left:0;right:0;top:70%;height:4px;background:linear-gradient(to bottom, transparent, rgba(60,40,15,.22) 45%, rgba(255,240,200,.3) 55%, transparent);transform:rotate(-.4deg)}
  /* dog-eared corner */
  .spread .dogear{position:absolute;right:0;bottom:0;width:58px;height:58px;
    background:linear-gradient(225deg, #15100c 0 50%, #f0e4c0 50%, #d6c393 60%, #c9b27f 100%);
    box-shadow:-3px -3px 6px rgba(0,0,0,.25);}
  /* binder rings */
  .spread::before{
    content:"";position:absolute;left:50%;top:0;bottom:0;
    background:
      radial-gradient(circle at 50% 14%, #b5b5b0 0 7px, var(--ring) 7px 10px, #333 10px 12px, transparent 13px),
      radial-gradient(circle at 50% 50%, #b5b5b0 0 7px, var(--ring) 7px 10px, #333 10px 12px, transparent 13px),
      radial-gradient(circle at 50% 86%, #b5b5b0 0 7px, var(--ring) 7px 10px, #333 10px 12px, transparent 13px),
      radial-gradient(circle at 50% 14.5%, rgba(0,0,0,.45) 0 12px, transparent 16px),
      radial-gradient(circle at 50% 50.5%, rgba(0,0,0,.45) 0 12px, transparent 16px),
      radial-gradient(circle at 50% 86.5%, rgba(0,0,0,.45) 0 12px, transparent 16px);
    width:60px;margin-left:-30px;pointer-events:none;z-index:2;
  }
  .page{padding:26px 34px 30px;position:relative;min-height:0;overflow:hidden;z-index:1}
  .page.left{padding-right:52px}
  .page.right{padding-left:56px}

  /* left page */
  .head{display:grid;grid-template-columns:150px 1fr;gap:18px;align-items:start}
  .polaroid{
    position:relative;background:#f1ead9;padding:8px 8px 6px;transform:rotate(-2.2deg);
    box-shadow:0 5px 12px rgba(0,0,0,.4);width:150px;
    background-image:radial-gradient(ellipse at 80% 90%, rgba(120,90,40,.25), transparent 50%);
  }
  .polaroid::before,.polaroid::after{ /* tape */
    content:"";position:absolute;width:54px;height:16px;background:rgba(230,215,160,.75);
    box-shadow:0 1px 2px rgba(0,0,0,.2);
  }
  .polaroid::before{left:-14px;top:-7px;transform:rotate(-38deg)}
  .polaroid::after{right:-12px;top:-6px;transform:rotate(32deg)}
  .polaroid .photo{
    width:100%;aspect-ratio:1/1.1;background:
      radial-gradient(ellipse at 50% 40%, #6b5a45 0%, #2b211a 60%, #120d0a 100%);
    display:grid;place-items:center;overflow:hidden;filter:contrast(1.05) sepia(.15);
  }
  .polaroid img{width:100%;height:100%;object-fit:cover;display:block}
  .polaroid .cap{font-family:'Homemade Apple',cursive;font-size:15px;text-align:center;margin-top:6px;letter-spacing:.5px;color:#111}
  .fields{font-size:22px;line-height:28px}
  .fields b{font-family:'Caveat',cursive;font-weight:700;font-size:25px;color:#111;margin-right:6px;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
  .label{font-family:'Caveat',cursive;font-weight:700;font-size:26px;color:#111;margin-top:6px;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
  .bio{font-size:20px;line-height:28px;margin:0}
  .facts{font-size:20px;line-height:28px;margin:0;padding-left:0;list-style:none}
  .facts li{margin:0}

  /* right page */
  .dice{display:grid;grid-template-columns:repeat(3,1fr);gap:6px 10px;margin:0 8px 14px}
  .die{display:flex;flex-direction:column;align-items:center;font-size:20px;color:var(--ink-soft)}
  .die svg{width:78px;height:78px;display:block;overflow:visible}
  .die svg .o{fill:rgba(255,245,215,.35);stroke:#2a2118;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
  .die svg .f{fill:none;stroke:#2a2118;stroke-width:1.4;stroke-opacity:.45;stroke-linecap:round;stroke-linejoin:round}
  .die svg .k{fill:var(--paper);stroke:none}
  .die svg text{font-family:'Caveat',cursive;font-weight:700;font-size:30px;fill:#1a1410;text-anchor:middle;dominant-baseline:central}
  .abilities{font-size:18.5px;line-height:28px}
  .abilities .label{margin-bottom:0}
  .abilities p{margin:0}
  .abilities b{font-weight:700}

  /* per-sheet oddities, positioned from the CHARACTERS data */
  .mark{position:absolute;pointer-events:none;z-index:1}
  .mark.stamp{font-family:'Rock Salt',cursive;font-size:30px;letter-spacing:2px;color:rgba(150,30,25,.55);
    border:3px solid rgba(150,30,25,.5);padding:2px 12px;border-radius:6px;mix-blend-mode:multiply}
  .mark.scrawl{font-family:'Homemade Apple',cursive;font-size:15px;color:rgba(40,30,20,.75);white-space:pre-line;line-height:1.5}
  .mark.pencil{font-family:'Caveat',cursive;font-size:18px;color:rgba(60,60,70,.7);white-space:pre-line;line-height:1.2}
  .mark.burn{width:26px;height:26px;border-radius:50%;
    background:radial-gradient(circle, #15100c 0 34%, #3a2010 40%, rgba(120,70,20,.75) 58%, rgba(120,70,20,.2) 78%, transparent 100%)}
  .mark.oil{border-radius:50%;background:radial-gradient(circle, rgba(30,25,20,.55), rgba(30,25,20,.18) 60%, transparent 100%);mix-blend-mode:multiply}
  .mark.print{width:34px;height:44px;border-radius:50% 50% 45% 45%;
    background:repeating-radial-gradient(ellipse at 50% 60%, rgba(40,30,20,.35) 0 1px, transparent 1px 3px);mix-blend-mode:multiply}
  .mark.ring{border-radius:50%;border:5px solid rgba(110,70,25,.32);box-shadow:inset 0 0 6px rgba(110,70,25,.25), 0 0 4px rgba(110,70,25,.15)}
  .mark.wrapper{width:46px;height:30px;background:linear-gradient(135deg,#c9932f,#e8b84a 45%,#b8801f);
    clip-path:polygon(12% 0,88% 6%,100% 50%,90% 96%,10% 100%,0 50%);box-shadow:1px 2px 3px rgba(0,0,0,.3)}
  .mark.receipt{width:96px;z-index:3;padding:6px 8px;background:#f6f0dd;font-family:'Caveat',cursive;font-size:13px;line-height:1.25;color:#333;
    box-shadow:1px 2px 5px rgba(0,0,0,.35);clip-path:polygon(0 0,100% 0,100% 94%,90% 100%,80% 94%,70% 100%,60% 94%,50% 100%,40% 94%,30% 100%,20% 94%,10% 100%,0 94%);white-space:pre-line}
  .mark.gear svg{width:100%;height:100%}
  .mark.gear{opacity:.7}
  .mark.torn{width:70px;height:120px;background:#15100c;z-index:3;
    clip-path:polygon(0 0,100% 0,72% 10%,90% 22%,68% 38%,86% 50%,64% 64%,84% 78%,60% 90%,78% 100%,0 100%);
    filter:drop-shadow(-2px 1px 2px rgba(0,0,0,.5))}
  .mark.blood{border-radius:50% 45% 55% 50%;background:radial-gradient(circle, rgba(120,20,15,.5), rgba(120,20,15,.15) 65%, transparent);mix-blend-mode:multiply}


  /* index tabs along the top edge, like the dividers in a case binder */
  #tabs{display:flex;gap:6px;width:min(1180px,100%);margin:0 auto -14px;padding:0 40px;position:relative;z-index:5}
  #tabs button{
    font-family:'Caveat','Segoe Print','Bradley Hand',cursive;font-weight:700;font-size:22px;color:var(--ink);
    background:linear-gradient(to bottom,#e6d7ad,#d1bd8c);border:1px solid rgba(60,40,15,.55);border-bottom:none;
    border-radius:10px 10px 0 0;padding:8px 20px 20px;cursor:pointer;transform:translateY(6px);
    box-shadow:inset 0 1px 0 rgba(255,245,215,.6), 0 -2px 6px rgba(0,0,0,.35);
    transition:transform .15s ease;
  }
  #tabs button:nth-child(2n){background:linear-gradient(to bottom,#d9c39a,#c4ad7c)}
  #tabs button:nth-child(3n){background:linear-gradient(to bottom,#e2cfa0,#cbb480)}
  #tabs button:hover{transform:translateY(2px)}
  #tabs button[aria-selected="true"]{transform:translateY(0);background:linear-gradient(to bottom,#f0e3bd,var(--paper));
    box-shadow:inset 0 1px 0 rgba(255,245,215,.8), 0 -3px 8px rgba(0,0,0,.45);z-index:6}
  #tabs button:focus-visible{outline:3px solid #8a5a2a;outline-offset:2px}
  .book{display:none}
  .book.active{display:block}
  @media (max-width:820px){#tabs{padding:0 8px;flex-wrap:wrap;margin-bottom:-4px}#tabs button{font-size:18px;padding:6px 12px 14px}}
  @media print{#tabs{display:none}.book{display:block}}
  @media (max-width:820px){
    .book{aspect-ratio:auto;padding:14px}
    .book::before{display:none}
    .spread{grid-template-columns:1fr}
    .spread::before{display:none}
    .page.left,.page.right{padding:20px}
    .book::after{display:none}
  }
  @media print{
    @page{size:landscape;margin:8mm}
    body{background:#fff;padding:0}
    .book{box-shadow:none;margin:0 auto 6mm;width:100%}
    .spread .dogear{background:linear-gradient(225deg, #fff 0 50%, #f0e4c0 50%, #d6c393 60%, #c9b27f 100%)}
  }
</style>
</head>

<script>

   centre, and the number sitting on a small paper-coloured knockout so nothing
   crosses it. Points are nudged slightly off-true so they read as hand drawn. */

     <g class="f"><line x1="15" y1="16" x2="22" y2="10"/><line x1="85" y1="16" x2="92" y2="10"/><line x1="22" y1="10" x2="92" y2="10"/><line x1="92" y1="10" x2="92" y2="80"/><line x1="85" y1="86" x2="92" y2="80"/></g>`,

     <g class="f"><polyline points="50,6 50,42"/><polyline points="8,89 34,72"/><polyline points="93,88 66,72"/></g>`
};

function die(sides, label){
  const cy = sides===4 ? 64 : 51;
  return `<div class="die"><svg viewBox="0 0 100 100" aria-label="d${sides} ${label}">
    ${DIE_SHAPES[sides]}
    <ellipse class="k" cx="50" cy="${cy}" rx="15" ry="12"/>
    <text x="50" y="${cy}">${sides}</text></svg><span>${label}</span></div>`;
}

    ["College Boy","Spend 1 Coin to know an obscure fact. Relevant, boring, true."],
    ["Nobody Checks on the Kid","Once per scene, while the old men are talking, you've already done something small: pocketed a thing, read a note, tried a door. Tell the GM what. It happened."],
    ["I Know a Guy","Spend 1 Coin. Someone from school or the neighbourhood can help with this. Roll Charm to get them to. They are nineteen and unreliable."],
    ["Crack, Proving It","Extra Coin when you fail while trying to impress the old men."]
  ],
  marks:[
    {cls:"torn",style:"right:0;top:0"},
    {cls:"pencil",style:"left:34%;top:29%;transform:rotate(-4deg);font-size:17px",text:"<- ADULT. 19. check the file."},
    {cls:"pencil",style:"left:6%;bottom:0;transform:rotate(2deg);font-size:15px",text:"mind flayers killed: 4  1  (Glasya says 1)"},
    {cls:"scrawl",style:"right:10%;bottom:0;transform:rotate(-2deg);font-size:13px",text:"this page is confiscated  - E.B."}
  ]
}
];

const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
const GEAR = `<svg viewBox="0 0 100 100"><g fill="none" stroke="rgba(40,30,20,.7)" stroke-width="2.2">
  <circle cx="50" cy="50" r="26"/><circle cx="50" cy="50" r="9"/>
  ${Array.from({length:10},(_,i)=>{const a=i*36*Math.PI/180,x1=50+26*Math.cos(a),y1=50+26*Math.sin(a),x2=50+36*Math.cos(a),y2=50+36*Math.sin(a);return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke-width="7"/>`;}).join('')}
  <line x1="50" y1="41" x2="50" y2="24"/><line x1="59" y1="50" x2="76" y2="50" stroke-dasharray="3 3"/></g></svg>`;
function mark(m){
  const inner = m.svg ? GEAR : (m.text ? esc(m.text) : '');
  return `<i class="mark ${m.cls}" style="${m.style}">${inner}</i>`;
}

function sheet(c, i){
  return `
  <article class="book" data-page="${49+i}">
    <div class="spread">
      <i class="crease a"></i><i class="crease b"></i><i class="crease c"></i><i class="dogear"></i>
      ${(c.marks||[]).map(mark).join('')}
      <section class="page left">
        <div class="head">
          <div class="polaroid">
            <div class="photo"><img src="${c.photo}" alt="" onerror="this.remove()"></div>
            <div class="cap">HEADSHOT</div>
          </div>
          <div class="fields">
            <div><b>Name:</b> ${esc(c.name)}</div>
            <div><b>Age:</b> ${esc(c.age)}</div>
            <div><b>Gender:</b> ${esc(c.gender)}</div>
            <div><b>Height:</b> ${esc(c.height)}</div>
            <div><b>Weight:</b> ${esc(c.weight)}</div>
            <div><b>Race:</b> ${esc(c.race)}</div>
          </div>
        </div>
        <div class="fields" style="margin-top:6px"><b>Rank:</b> ${esc(c.rank)}</div>
        <div class="label">Short bio:</div>
        <p class="bio">${esc(c.bio)}</p>
        <div class="label">Facts:</div>
        <ul class="facts">${c.facts.map(f=>`<li>${esc(f)}</li>`).join('')}</ul>
      </section>
      <section class="page right">
        <div class="dice">${c.dice.map(([n,l])=>die(n,l)).join('')}</div>
        <div class="abilities">
          <div class="label">Abilities:</div>
          ${c.abilities.map(([t,d])=>`<p><b>${esc(t)}:</b> ${esc(d)}</p>`).join('')}
        </div>
      </section>
    </div>
  </article>`;
}

document.getElementById('sheets').innerHTML = CHARACTERS.map(sheet).join('');

const books=[...document.querySelectorAll('.book')];
const tabs=document.getElementById('tabs');
tabs.innerHTML=CHARACTERS.map((c,i)=>`<button role="tab" data-i="${i}" aria-selected="false">${esc(c.name)}</button>`).join('');
function show(i){
  books.forEach((b,j)=>b.classList.toggle('active',j===i));
  [...tabs.children].forEach((t,j)=>t.setAttribute('aria-selected',j===i));
  history.replaceState(null,'','#'+CHARACTERS[i].name.split(' ')[0].toLowerCase());
}
tabs.addEventListener('click',e=>{const t=e.target.closest('button');if(t)show(+t.dataset.i);});
tabs.addEventListener('keydown',e=>{
  const cur=[...tabs.children].findIndex(t=>t.getAttribute('aria-selected')==='true');
  if(e.key==='ArrowRight')show((cur+1)%books.length);
  if(e.key==='ArrowLeft')show((cur-1+books.length)%books.length);
});
const start=CHARACTERS.findIndex(c=>'#'+c.name.split(' ')[0].toLowerCase()===location.hash);
show(start>=0?start:0);
</script>
</body>
</html>
